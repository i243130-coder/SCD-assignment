apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: civicpulse-observability
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/i243130-coder/SCD-assignment.git
    targetRevision: deploy/gitops
    path: k8s/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
