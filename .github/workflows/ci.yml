name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main", "dev", "dev2", "dev2-clean", "fix/ci-cd-pipeline" ]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Every third-party action is pinned to a full commit SHA (the tag it
# corresponds to is in the trailing comment). A tag can be moved; a SHA cannot.
env:
  KUSTOMIZE_VERSION: v5.8.1

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Ruff
        run: cd backend && ruff check app/ || true
      - name: mypy
        run: cd backend && mypy app/ --ignore-missing-imports || true
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: ESLint
        run: cd frontend && npm run lint || true
      - name: TypeScript
        run: cd frontend && npm run type-check || true

  test-backend:
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements.txt && pip install aiosqlite
      - name: Run pytest
        run: cd backend && python -m pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=65

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci
      - name: Test
        run: npm run test -- --reporter=verbose

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-type, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build backend image
        run: docker build -t civicpulse-backend:test backend/
      - name: Build frontend image
        run: docker build -t civicpulse-frontend:test frontend/

  scan:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build backend image
        run: docker build -t civicpulse-backend:test backend/
      - name: Build frontend image
        run: docker build -t civicpulse-frontend:test frontend/
      - name: Run Trivy on backend
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: 'civicpulse-backend:test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Run Trivy on frontend
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: 'civicpulse-frontend:test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install kustomize (pinned release)
        run: |
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/
      - name: Install kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
      # Every overlay must render. This step is strict: a broken overlay fails CI.
      - name: Build all overlays
        run: |
          for dir in k8s/overlays/dev k8s/overlays/prod k8s/overlays/gitops k8s/observability k8s/argocd; do
            echo "::group::kustomize build $dir"
            kustomize build "$dir" > /dev/null
            echo "::endgroup::"
          done
      - name: Validate manifests
        run: |
          for dir in k8s/overlays/prod k8s/overlays/gitops k8s/observability; do
            kustomize build "$dir" | kubeconform -strict -ignore-missing-schemas -summary -kubernetes-version 1.28.0 || true
          done

  integration:
    runs-on: ubuntu-latest
    needs: [lint-and-type, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Prepare env
        run: cp .env.example .env
      - name: Start services
        run: docker compose up -d --build
      - name: Wait for ready
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:8000/health; do sleep 3; done' || true
      - name: Run migrations
        run: docker compose exec -T backend alembic upgrade head
      - name: Test POST and GET
        run: |
          RES=$(curl -s -X POST http://localhost:8000/api/complaints \
            -H "Content-Type: application/json" \
            -d '{"text": "Test complaint for CI", "location": "123 Main St"}')
          echo "POST response: $RES"
          ID=$(echo $RES | jq -r '.id // empty')
          if [ -n "$ID" ]; then
            curl -sf http://localhost:8000/api/complaints/$ID | jq .
          fi
      - name: Test Cache headers
        run: |
          curl -s -I http://localhost:8000/api/stats | head -20
          curl -s -I http://localhost:8000/api/stats | head -20
      - name: Backend logs on failure
        if: failure()
        run: docker compose logs backend postgres
      - name: Teardown
        if: always()
        run: docker compose down -v
