name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main", "dev", "dev2", "dev2-clean" ]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci
      - name: Test
        run: npm run test -- --reporter=verbose
