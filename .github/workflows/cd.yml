name: CD

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements.txt && pip install aiosqlite pytest pytest-asyncio pytest-cov httpx
      - name: Run backend tests
        run: cd backend && python -m pytest tests/
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Run frontend tests
        run: cd frontend && npm run test

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ github.sha }}
      - name: Generate SBOM for backend
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ github.sha }}
          
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${{ github.sha }}
      - name: Generate SBOM for frontend
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${{ github.sha }}

  deploy-k8s:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        run: kind create cluster
      - name: Install kustomize
        run: curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash && sudo mv kustomize /usr/local/bin/
      - name: Update image tags
        run: |
          cd k8s/overlays/prod
          kustomize edit set image backend=ghcr.io/${{ github.repository_owner }}/civicpulse-backend:${{ github.sha }}
          kustomize edit set image frontend=ghcr.io/${{ github.repository_owner }}/civicpulse-frontend:${{ github.sha }}
      - name: Apply
        run: kustomize build k8s/overlays/prod | kubectl apply -f -
      - name: Wait
        run: kubectl rollout status deployment/backend -n civicpulse --timeout=120s
      - name: Smoke test
        run: |
          kubectl port-forward svc/backend -n civicpulse 8000:8000 &
          sleep 5
          curl -s http://localhost:8000/health
      - name: Print HPA
        run: kubectl get hpa -n civicpulse
